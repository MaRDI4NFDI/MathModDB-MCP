[project]
name = "mathmoddb-mcp"
version = "0.1.0"
description = "MathModDB MCP Server to explore and query the MathModDB knowledge graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.7.4",
    "fastmcp>=2.14.2",
    "openai>=2.15.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.16.2",
    "rich>=14.2.0",
    "sentence-transformers>=5.2.0",
    "sparqlwrapper>=2.0.0",
    "tenacity>=9.1.2",
    "toon-format==0.9.0b1",
    "rustworkx>=0.17.1",
    "nest-asyncio>=1.6.0",
    "typer>=0.17.4",
]

[project.scripts]
mathmoddb = "cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml"]

[tool.uv]
package = true
prerelease = "allow"
